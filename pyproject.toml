[project]
name = "opencaptune"
version = "0.1.0"
description = "Open-source tooling for Sennheiser headphones orphaned by the death of CapTune"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
macos = [
  "pyobjc-framework-IOBluetooth>=10",
  "pyobjc-framework-CoreBluetooth>=10",
]

[project.scripts]
captune = "opencaptune.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencaptune"]
