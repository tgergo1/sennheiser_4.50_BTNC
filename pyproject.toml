[project]
name = "opencaptune"
version = "0.1.0"
description = "Open-source tooling for Sennheiser headphones orphaned by the death of CapTune"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sounddevice>=0.4",
]

[project.optional-dependencies]
macos = [
  "pyobjc-framework-IOBluetooth>=10",
  "pyobjc-framework-CoreBluetooth>=10",
]
dev = ["pytest>=7"]

[project.scripts]
captune = "opencaptune.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencaptune"]
